name: Deploy portfolio

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: portfolio-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
      - run: >-
          npm run cdk:diff -- --no-change-set
          -c githubRepository=${{ github.repository }}
          -c githubOidcSubject=repo:${{ github.repository_owner }}@${{ github.repository_owner_id }}/portfolio-site@${{ github.repository_id }}:ref:refs/heads/main
          -c domainName=${{ vars.PORTFOLIO_DOMAIN }}
          -c certificateArn=${{ vars.PORTFOLIO_CERTIFICATE_ARN }}
      - run: >-
          npm run cdk:deploy -- --require-approval never
          -c githubRepository=${{ github.repository }}
          -c githubOidcSubject=repo:${{ github.repository_owner }}@${{ github.repository_owner_id }}/portfolio-site@${{ github.repository_id }}:ref:refs/heads/main
          -c domainName=${{ vars.PORTFOLIO_DOMAIN }}
          -c certificateArn=${{ vars.PORTFOLIO_CERTIFICATE_ARN }}
